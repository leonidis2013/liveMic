# docker compose up -d
# Then open http://<this machine's IP>:8080 and set everything up from the web page:
# Settings > Receivers > Search. Settings are kept in the livemic-data volume.
services:
  livemic:
    image: ghcr.io/leonidis2013/livemic:latest
    build: .
    container_name: livemic
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - livemic-data:/data
    environment:
      TZ: America/Chicago

volumes:
  livemic-data:
