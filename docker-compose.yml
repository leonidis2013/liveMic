# Put your config at ./data/config.json (copy config.example.json), then:
#   docker compose up -d
# With no config file it starts in demo mode with simulated receivers.
services:
  livemic:
    image: ghcr.io/leonidis2013/livemic:latest
    build: .
    container_name: livemic
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
    environment:
      TZ: America/Chicago
